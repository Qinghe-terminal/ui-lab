<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Lab - 设计实验室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 配置 Tailwind 支持 class 模式的深色 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <style>
        body { font-family: "SimSun", "宋体", "Songti SC", serif; }
        html { font-size: clamp(16px, 1.5vw, 22px); }

        /* 全局变量定义（与 color.html 保持一致） */
        :root {
            --bg-page: #f4f6f8;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --color-primary: #405de6;
        }

        html.dark {
            --bg-page: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --color-primary: #5851db;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }

        .custom-card {
            background-color: var(--bg-card);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }
        
        .text-sub { color: var(--text-sub); }
        .text-primary { color: var(--color-primary); }
    </style>
</head>
<body class="p-8">

    <!-- 全局导航栏 -->
    <nav class="custom-card shadow-sm sticky top-0 z-50 mb-8 -mx-8 -mt-8 border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="font-bold text-primary">UI Lab 实验室</span>
            <div class="space-x-4 flex items-center">
                <a href="index.html" class="text-primary font-bold border-b-2 border-current pb-1">目录</a>
                <a href="color.html" class="text-sub hover:text-primary transition">配色规范</a>
                <a href="typography.html" class="text-sub hover:text-primary transition">字体规范</a>
                <a href="whitepaper.html" class="text-sub hover:text-primary transition">功能白皮书</a>
                
                <!-- 深色模式切换按钮 -->
                <button id="theme-toggle" class="ml-4 px-3 py-1 bg-gray-200 dark:bg-gray-700 rounded text-sm hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                    切换模式
                </button>
            </div>
        </div>
    </nav>

    <!-- 主体内容 -->
    <div class="max-w-3xl mx-auto custom-card p-8 rounded-xl shadow-lg mb-10">
        <h1 class="text-3xl font-bold text-primary mb-2">UI 实验室目录</h1>
        <p class="text-sub mb-8">用于测试和制定设计规范与功能逻辑。</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 卡片：配色 -->
            <a href="color.html" class="block p-6 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm hover:shadow-md transition bg-white dark:bg-gray-800">
                <h2 class="text-xl font-bold mb-2">1. 颜色定义规范</h2>
                <p class="text-sub text-sm">确定网站的主题色、背景色、文字色、状态色（警告/成功/危险），以及深色模式变量</p>
            </a>
            <!-- 卡片：字体 -->
            <a href="typography.html" class="block p-6 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm hover:shadow-md transition bg-white dark:bg-gray-800">
                <h2 class="text-xl font-bold mb-2">2. 字体层级规范</h2>
                <p class="text-sub text-sm">定义各级标题、正文、代码块的字号和字重（粗细）</p>
            </a>
            <!-- 卡片：白皮书 -->
            <a href="whitepaper.html" class="block p-6 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm hover:shadow-md transition bg-white dark:bg-gray-800">
                <h2 class="text-xl font-bold mb-2">3. 功能白皮书</h2>
                <p class="text-sub text-sm">定义防复制策略、路径复制按钮、全局搜索逻辑等底层机制</p>
            </a>
            <!-- 卡片：搜索测试 -->
            <a href="search.html" class="block p-6 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm hover:shadow-md transition bg-white dark:bg-gray-800">
                <h2 class="text-xl font-bold mb-2">4. 搜索功能测试</h2>
                <p class="text-sub text-sm">测试前端模糊搜索、多层级结果与高亮显示的可行性</p>
            </a>
        </div>
    </div>

    <!-- 切换深色模式的逻辑 -->
    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const html = document.documentElement;

        if (localStorage.getItem('theme') === 'dark' || 
            (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        }

        toggleBtn.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>
</body>
</html>
